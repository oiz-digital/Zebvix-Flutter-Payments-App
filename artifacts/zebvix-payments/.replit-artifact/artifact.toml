kind = "mobile"
previewPath = "/zebvix-payments/"
title = "Zebvix Splash Preview (Expo)"
description = "Expo-rendered visual preview of the Zebvix splash only. The actual Flutter and Dart app source, Android project, and iOS project are in flutter_app/."
version = "1.0.0"
id = "artifacts/zebvix-payments"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/zebvix-payments/" ]
localPort = 21891

[services.development]
run = "pnpm --filter @workspace/zebvix-payments run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/zebvix-payments", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/zebvix-payments", "run", "serve" ]

[services.env]
PORT = "21891"
BASE_PATH = "/zebvix-payments/"
