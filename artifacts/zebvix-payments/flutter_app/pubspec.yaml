name: zebvix_payments
description: Zebvix payments splash experience for Flutter.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true
  assets:
    - assets/images/zebvix-splash.webp

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/icon.png
  remove_alpha_ios: true

flutter_native_splash:
  color: '#F2FFF8'
  image: assets/images/icon.png
  android_12:
    color: '#F2FFF8'
    image: assets/images/icon.png
